<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title>Anubis — Dashboard de modération</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- `sizes` sur l'ICO : sans lui, Chrome le prefere au SVG, qui suit
		     pourtant le theme clair/sombre du navigateur. -->
		<link rel="icon" href="favicon.ico" sizes="32x32" />
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
		<script>
			// Applique le theme avant le premier rendu : sans ca, la page flashe dans
			// le mauvais mode le temps qu'Angular charge ThemeService.
			(function () {
				var stored = localStorage.getItem('anubis-theme');
				// Sombre par defaut : seule une preference systeme explicitement
				// claire bascule. Sans preference exprimee, on reste en sombre.
				var prefersLight = window.matchMedia(
					'(prefers-color-scheme: light)',
				).matches;
				var theme =
					stored === 'light' || stored === 'dark'
						? stored
						: prefersLight
							? 'light'
							: 'dark';
				document.documentElement.setAttribute('data-theme', theme);
			})();
		</script>
	</head>
	<body>
		<app-root></app-root>
	</body>
</html>
