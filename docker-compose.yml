# La base PostgreSQL est une ressource Coolify distincte : elle vit sur un
# autre reseau Docker que cette stack. Sans rattachement explicite, `api` et
# `bot` ne resolvent pas son nom d'hote et echouent au demarrage (Prisma
# P1001). `webapp` n'en a pas besoin : il ne sert que des fichiers statiques,
# le navigateur appelle /api via Traefik.
networks:
  coolify:
    external: true

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    # `default` doit rester explicite : des qu'on nomme un reseau, Compose
    # cesse d'attacher le service au reseau par defaut de la stack.
    networks: [default, coolify]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      GUILD_ID: ${GUILD_ID}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      CORS_ORIGINS: https://${APP_DOMAIN}
      COOKIE_SECURE: "true"
      MAX_FAILED_LOGINS: 5
      LOCKOUT_MINUTES: 15

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    networks: [default, coolify]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      BOT_TOKEN: ${BOT_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      GUILD_HOST_ID: ${GUILD_HOST_ID}
