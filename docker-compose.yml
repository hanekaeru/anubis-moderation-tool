# La base PostgreSQL est une ressource Coolify distincte : elle vit sur un
# autre reseau Docker que cette stack. Sans rattachement explicite, `api` et
# `bot` ne resolvent pas son nom d'hote et echouent au demarrage (Prisma
# P1001). `webapp` n'en a pas besoin : il ne sert que des fichiers statiques,
# le navigateur appelle /api via Traefik.
networks:
    coolify:
        external: true

services:
    api:
        build:
            context: .
            dockerfile: api/Dockerfile
        restart: unless-stopped
        # `default` doit rester explicite : des qu'on nomme un reseau, Compose
        # cesse d'attacher le service au reseau par defaut de la stack.
        networks: [default, coolify]
        environment:
            NODE_ENV: production
            PORT: 3000
            # Vide, volontairement : Traefik route `/api/*` vers ce conteneur en
            # retirant le prefixe. Si l'API le remettait, chaque route attendrait
            # `/api/api/...` et repondrait 404. En local, la variable est absente et
            # le prefixe `api` par defaut s'applique.
            API_GLOBAL_PREFIX: ""
            DATABASE_URL: ${DATABASE_URL}
            GUILD_ID: ${GUILD_ID}
            JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
            JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
            ACCESS_TOKEN_TTL: 15m
            REFRESH_TOKEN_TTL_DAYS: 7
            CORS_ORIGINS: https://${APP_DOMAIN}
            COOKIE_SECURE: "true"
            MAX_FAILED_LOGINS: 5
            LOCKOUT_MINUTES: 15
            # Laisse a "true" en production. A "false", le second facteur n'est
            # plus demande, y compris aux comptes qui l'ont active.
            TWO_FACTOR_ENABLED: ${TWO_FACTOR_ENABLED:-true}
            # Verification Battle.net (facultative). Les trois ensemble, ou
            # aucune : sans elles la fonctionnalite se declare indisponible
            # plutot que d'envoyer les arrivants sur une erreur Blizzard.
            BATTLENET_CLIENT_ID: ${BATTLENET_CLIENT_ID:-}
            BATTLENET_CLIENT_SECRET: ${BATTLENET_CLIENT_SECRET:-}
            BATTLENET_REDIRECT_URI: https://${APP_DOMAIN}/api/verification/battlenet/callback
            # Import des matchs esport (facultatif). Vide : l'import est
            # annonce indisponible, la saisie manuelle reste entiere.
            PANDASCORE_TOKEN: ${PANDASCORE_TOKEN:-}

    webapp:
        build:
            context: .
            dockerfile: webapp/Dockerfile
        restart: unless-stopped

    bot:
        build:
            context: .
            dockerfile: bot/Dockerfile
        restart: unless-stopped
        networks: [default, coolify]
        environment:
            NODE_ENV: production
            DATABASE_URL: ${DATABASE_URL}
            BOT_TOKEN: ${BOT_TOKEN}
            CLIENT_ID: ${CLIENT_ID}
            GUILD_HOST_ID: ${GUILD_HOST_ID}
            # URL exterieure de l'API : le bot y compose le lien de
            # verification que le membre clique, il ne l'appelle jamais.
            PUBLIC_API_URL: https://${APP_DOMAIN}/api
